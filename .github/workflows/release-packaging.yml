name: Release packaging

on:
  pull_request:
    paths:
      - '.github/scripts/bundle-grammars.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-packaging.yml'
      - 'tests/releases/**'
  push:
    branches: [main]
    paths:
      - '.github/scripts/bundle-grammars.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-packaging.yml'
      - 'tests/releases/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check grammar archive portability
        run: python3 -m unittest discover -s tests/releases -v
