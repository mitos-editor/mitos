name: Build
on:
  pull_request:
    paths-ignore:
      - 'book/**'
      - 'docs/**'
      - 'website/**'
      - '*.md'
      - 'screenshot.png'
  push:
    branches:
      - main
  merge_group:
  schedule:
    - cron: "00 01 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MSRV: "1.97.1"
  # This key can be changed to bust the cache of tree-sitter grammars.
  GRAMMAR_CACHE_VERSION: ""

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    if: github.repository == 'mitos-editor/mitos' || github.event_name != 'schedule'
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: 1
      MITOS_LOG_LEVEL: info
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: build
          cache-grammars: 'true'
          grammar-cache-version: ${{ env.GRAMMAR_CACHE_VERSION }}

      - name: Run cargo test
        run: cargo test --workspace --locked

      - name: Run cargo integration-test
        run: cargo integration-test --locked

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-latest", "macos-latest", "windows-latest", "ubuntu-24.04-arm", "windows-11-arm"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}

  dap-smoke:
    name: Real DAP adapter
    runs-on: ubuntu-latest
    if: github.repository == 'mitos-editor/mitos' || github.event_name != 'schedule'
    timeout-minutes: 10
    env:
      MITOS_DISABLE_AUTO_GRAMMAR_BUILD: '1'
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: dap-smoke

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false

      - name: Install pinned Delve adapter
        run: go install github.com/go-delve/delve/cmd/dlv@v1.27.2
        env:
          GOBIN: ${{ runner.temp }}/dap-adapter

      - name: Launch, inspect, and shut down a real debug session
        run: cargo test -p dap --test delve_smoke --locked -- --ignored --nocapture
        env:
          MITOS_DLV: ${{ runner.temp }}/dap-adapter/dlv

  lints:
    name: Lints
    runs-on: ubuntu-latest
    if: github.repository == 'mitos-editor/mitos' || github.event_name != 'schedule'
    env:
      MITOS_DISABLE_AUTO_GRAMMAR_BUILD: '1'
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          components: rustfmt, clippy
          cache-key: build

      - name: Run cargo fmt
        run: cargo fmt --all --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run cargo doc
        run: cargo doc --no-deps --workspace --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
