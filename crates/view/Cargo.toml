[package]
name = "view"
description = "Editor state, documents, views, input, and themes for Mitos"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# Skip libtest benchmark harness, the benches use criterion.
bench = false

[features]
default = []
git = ["vcs/git"]
unicode-lines = ["editor-config/unicode-lines"]

[dependencies]
search.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
dashmap.workspace = true
diagnostics.workspace = true
editor-config.workspace = true
language-config.workspace = true
buffer.workspace = true
text-diff.workspace = true
text-io.workspace = true
text-layout.workspace = true
clipboard.workspace = true
language.workspace = true
theme.workspace = true
workspace.workspace = true
globset.workspace = true
file-watch.workspace = true
ignore.workspace = true
command-line.workspace = true
ui-core.workspace = true
pane-layout.workspace = true
stdx.workspace = true
core.workspace = true
event.workspace = true
fuzzy.workspace = true
word-index.workspace = true
loader.workspace = true
lsp.workspace = true
snippets.workspace = true
spelling.workspace = true
dap.workspace = true
debugger.workspace = true
vcs.workspace = true

foldhash.workspace = true
anyhow.workspace = true

tempfile.workspace = true

arc-swap.workspace = true

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "process", "macros", "fs", "parking_lot"] }
tokio-stream.workspace = true
futures-util.workspace = true

slotmap.workspace = true

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true

parking_lot.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Headless editor tests run independent Tokio runtimes in parallel.
event = { workspace = true, features = ["integration_test"] }
criterion.workspace = true
quickcheck.workspace = true

