[workspace]
resolver = "3"
members = [
  "crates/command-line",
  "crates/core",
  "crates/ui-core",
  "crates/view",
  "crates/term",
  "crates/tui",
  "crates/lsp-types",
  "crates/lsp",
  "crates/event",
  "crates/dap-types",
  "crates/dap",
  "crates/loader",
  "crates/vcs",
  "crates/parsec",
  "crates/snippets",
  "crates/stdx",
  "xtask",
]

default-members = [
  "crates/term"
]

[profile.release]
lto = "thin"

[profile.opt]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[profile.integration]
inherits = "test"
package.core.opt-level = 2
package.tui.opt-level = 2
package.term.opt-level = 2

[workspace.dependencies]
# Workspace crates
command-line = { path = "crates/command-line" }
core = { path = "crates/core" }
dap = { path = "crates/dap" }
dap-types = { path = "crates/dap-types" }
event = { path = "crates/event" }
loader = { path = "crates/loader" }
lsp = { path = "crates/lsp" }
lsp-types = { path = "crates/lsp-types" }
parsec = { path = "crates/parsec" }
snippets = { path = "crates/snippets" }
stdx = { path = "crates/stdx" }
term = { path = "crates/term" }
tui = { path = "crates/tui", default-features = false }
ui-core = { path = "crates/ui-core" }
vcs = { path = "crates/vcs" }
view = { path = "crates/view" }

# Runtime and diagnostics
anyhow = "1"
jiff = { version = "0.2.27", default-features = false, features = ["std"] }
log = "0.4"
thiserror = "2.0"

# Async and concurrency
arc-swap = "1.9"
dashmap = "6.2"
futures-executor = "0.3.32"
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
parking_lot = "0.12"
tokio = "1.50"
tokio-stream = "0.1.18"

# Collections and compact storage
arrayvec = "0.7"
bitflags = "2.12"
foldhash = "0.2"
hashbrown = "0.17"
indexmap = "2.14"
kstring = "2.0"
slotmap = "1.1.1"
smallvec = "1.15"
smartstring = "1.0.1"

# Text and Unicode
chardetng = "1.0"
encoding_rs = "0.8"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
textwrap = "0.16.2"
unicode-general-category = "1.1"
unicode-segmentation = "1.13"
unicode-width = "=0.2.0"
spellbook = "0.4"

# Parsing, search, and diffing
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
imara-diff = "0.2.0"
nucleo = "0.5.0"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
regex-automata = "0.4.14"
regex-cursor = "0.1.5"
tree-house = { version = "0.4", default-features = false }

# Serialization and configuration
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sonic-rs = "0.5"
toml = "1.1"

# Terminal and UI
clipboard-win = "5.4"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "std", "underline-color", "unstable-rendered-line-info"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
termina = "0.3"
termini = "1"

# System integration
# Same filesentry revision used by Helix PR #14544.
filesentry = { git = "https://github.com/helix-editor/filesentry", rev = "57713a3e062979f3c4f98c5506fee37385c8047d" }
dunce = "1.0"
etcetera = "0.11"
libc = "0.2.186"
open = "5.3.5"
rustix = "1.1"
signal-hook = "0.4"
signal-hook-tokio = "0.4"
tempfile = "3.27.0"
which = "8.0"
windows-sys = "0.61"

# Version control
gix = { version = "0.85.0", default-features = false }

# Grammar build tooling
cc = "1"
sha2 = "0.11"
threadpool = "1.0"

# Tests and benchmarks
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
indoc = "2.0.6"
quickcheck = { version = "1", default-features = false }
same-file = "1.0.1"

[workspace.package]
version = "25.7.1"
edition = "2024"
authors = ["Matouš Dzivjak <matousdzivjak@gmail.com>"]
categories = ["editor"]
repository = "https://github.com/mitos-editor/mitos"
homepage = "https://github.com/mitos-editor/mitos"
license = "MPL-2.0"
rust-version = "1.97.1"
