name: Rust setup
description: Install a Rust toolchain and warm the cargo + tree-sitter grammar caches.

inputs:
  toolchain:
    description: Rust toolchain to install.
    required: true
  components:
    description: Comma-separated rustup components.
    required: false
    default: ''
  cache-key:
    description: shared-key for Swatinem/rust-cache.
    required: true
  cache-grammars:
    description: Whether to prepare and cache pinned runtime grammars before tests or query checks.
    required: false
    default: 'false'
  grammar-cache-version:
    description: Bump to bust the grammar cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}

    - if: inputs.cache-grammars == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: runtime/grammars
        key: ${{ runner.os }}-${{ runner.arch }}-stable-v${{ inputs.grammar-cache-version }}-tree-sitter-grammars-${{ hashFiles('languages.toml') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-stable-v${{ inputs.grammar-cache-version }}-tree-sitter-grammars-

    - name: Fetch pinned grammar sources
      if: inputs.cache-grammars == 'true'
      shell: bash
      run: |
        # Successful fetches are reused, so retries only download missing sources.
        for attempt in 1 2 3; do
          if cargo run --locked --package grammar-build --bin grammar-fetch; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "::warning::Grammar fetch failed (attempt $attempt/3); retrying"
          sleep "$((attempt * 15))"
        done

    - name: Compile runtime grammars
      if: inputs.cache-grammars == 'true'
      shell: bash
      run: cargo run --locked --package grammar-build --bin grammar-build
