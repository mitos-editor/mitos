[workspace]
release_always = false
git_only = true
git_tag_enable = false
git_release_enable = false
changelog_update = false
# All workspace packages track the same editor release tag.
git_tag_name = "v{{ version }}"
semver_check = false
pr_draft = false

[[package]]
name = "term"
git_tag_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "buffer", "clipboard", "command-line", "core", "diagnostics", "dap", "dap-types", "debugger", "event",
  "grammar-build", "language", "language-config", "loader", "lsp", "lsp-types", "parsec", "search",
  "snippets", "spelling", "stdx", "text-io", "theme", "tui", "ui-core", "vcs",
  "view", "workspace", "xtask",
  "word-index", "file-watch", "pane-layout", "syntax-symbols",
  "text-layout", "text-render", "editor-config", "fuzzy", "text-diff",
]
git_release_name = "Mitos {{ version }}"
git_release_enable = true

[[package]]
name = "lsp-types"
# Preserve the vendored library's version independently of the editor.
release = false

# These crates did not exist at the last shared release. Use an unmatched tag
# pattern so release-plz treats them as new instead of loading missing packages.
# Remove this block after the first shared release containing these crates.
[[package]]
name = "buffer"
git_tag_name = "unreleased-{{ package }}-v{{ version }}"

