[package]
name = "grammar-build"
default-run = "grammar-fetch"
description = "Native grammar fetching and compilation for Mitos"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "grammar-fetch"
path = "src/main.rs"

[[bin]]
name = "grammar-build"
path = "src/build.rs"

[dependencies]
loader.workspace = true
workspace.workspace = true
anyhow.workspace = true
cc.workspace = true
threadpool.workspace = true
tempfile.workspace = true
gix = { workspace = true, features = ["blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "sha1", "sha256"] }
