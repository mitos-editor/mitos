name: Book

on:
  pull_request:
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
      - '.github/workflows/docs-rebuild.yml'
      - 'tests/docs/**'
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
      - '.github/workflows/docs-rebuild.yml'
      - 'tests/docs/**'
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: Build and check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MDBOOK_OUTPUT__LINKCHECK2__OPTIONAL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install link checker
        run: cargo +stable install mdbook-linkcheck2 --version 0.12.2 --locked
      - name: Build site
        run: ./book/cloudflare-build.sh
      - name: Test versioned documentation
        run: |
          PATH="$PWD/book/.bin:$PATH" python3 -m unittest discover -s tests/docs -v
          node --test tests/docs/test_versions.cjs
