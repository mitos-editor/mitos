name: Nix grammar lockfile
on:
  pull_request:
    paths:
      - languages.toml
      - nix/grammar-sources.json
      - 'xtask/**'
      - .github/workflows/nix-grammars.yml
  push:
    branches:
      - main
    paths:
      - languages.toml
      - nix/grammar-sources.json
      - 'xtask/**'
      - .github/workflows/nix-grammars.yml
  merge_group:

permissions:
  contents: read

jobs:
  check-nix-grammars:
    name: Check Nix Grammars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          cache-key: nix-update-grammars

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Update Nix tree-sitter grammars
        run: |
          cargo xtask update-nix-grammar-sources

      - name: Check uncommitted Nix grammar lockfile changes
        run: |
          git diff --exit-code -- nix/grammar-sources.json \
            || (echo "Run 'cargo xtask update-nix-grammar-sources' with Nix installed, commit nix/grammar-sources.json and push again" \
            && exit 1)
