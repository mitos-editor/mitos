name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'mitos-editor/mitos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ref: ${{ steps.prepare.outputs.ref }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare nightly tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/nightly.py prepare

  test:
    needs: prepare
    uses: ./.github/workflows/build.yml

  package:
    needs: [prepare, test]
    uses: ./.github/workflows/package-release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      tag: ${{ needs.prepare.outputs.tag }}
      attest: true

  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish nightly and keep the last 14 builds
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_REF: ${{ needs.prepare.outputs.ref }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
        run: python .github/scripts/nightly.py publish
