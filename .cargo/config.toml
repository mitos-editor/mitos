# Keep the platform-independent C runtime linkage setting alongside user target flags.
[target."cfg(all())"]
rustflags = ["-C", "target-feature=-crt-static"]


[alias]
xtask = "run --package xtask --"
# Keep the same workspace feature graph for integration and frontend unit tests.
integration-test = "test --features integration --profile integration --workspace --lib --test integration"

