[package]
name = "term"
description = "A post-modern text editor."
include = ["src/**/*", "README.md"]
default-run = "ms"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.deb]
# generate a .deb in target/debian/ with the command: cargo deb --no-build
name = "mitos"
assets = [
  { source = "target/release/ms", dest = "/usr/lib/mitos/", mode = "755" },
  { source = "../../contrib/ms_launcher.sh", dest = "/usr/bin/ms", mode = "755" },
  { source = "../../runtime/*", dest = "/usr/lib/mitos/runtime/", mode = "644" },
  { source = "../../runtime/grammars/*", dest = "/usr/lib/mitos/runtime/grammars/", mode = "644" }, # to avoid sources/
  { source = "../../runtime/queries/**/*", dest = "/usr/lib/mitos/runtime/queries/", mode = "644" },
  { source = "../../runtime/themes/**/*", dest = "/usr/lib/mitos/runtime/themes/", mode = "644" },
  { source = "../../README.md", dest = "/usr/share/doc/mitos/", mode = "644" },
  { source = "../../FORK.md", dest = "/usr/share/doc/mitos/", mode = "644" },
  { source = "../../LICENSE", dest = "/usr/share/doc/mitos/", mode = "644" },
  { source = "../../contrib/completion/ms.bash", dest = "/usr/share/bash-completion/completions/ms", mode = "644" },
  { source = "../../contrib/completion/ms.fish", dest = "/usr/share/fish/vendor_completions.d/ms.fish", mode = "644" },
  { source = "../../contrib/completion/ms.zsh", dest = "/usr/share/zsh/vendor-completions/_ms", mode = "644" },
  { source = "../../contrib/Mitos.desktop", dest = "/usr/share/applications/Mitos.desktop", mode = "644" },
  { source = "../../contrib/mitos.png", dest = "/usr/share/icons/hicolor/256x256/apps/mitos.png", mode = "644" },
]

[features]
default = ["git"]
unicode-lines = ["core/unicode-lines", "view/unicode-lines"]
integration = ["event/integration_test"]
git = ["vcs/git"]

[[bin]]
name = "ms"
path = "src/main.rs"

[dependencies]
stdx = { path = "../stdx" }
core = { path = "../core" }
event = { path = "../event" }
view = { path = "../view", features = ["term"] }
lsp = { path = "../lsp" }
dap = { path = "../dap" }
vcs = { path = "../vcs" }
loader = { path = "../loader" }

anyhow = "1"
once_cell = "1.21"

tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "process", "macros", "fs", "parking_lot"] }
tui = { path = "../tui", default-features = false, features = ["termina", "crossterm"] }
termina = { workspace = true, features = ["event-stream"] }
signal-hook = "0.4"
tokio-stream = "0.1"
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
arc-swap.workspace = true
termini = "1"
indexmap = { version = "2.14", features = ["serde"] }

# Logging
log = { version = "0.4", features = ["std"] }

# File picker
nucleo.workspace = true
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
# markdown doc rendering
pulldown-cmark = { version = "0.13", default-features = false }
thiserror.workspace = true

# opening URLs
open = "5.3.5"

# config
toml.workspace = true

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

dashmap = "6.2"

parking_lot.workspace = true

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }

[target.'cfg(not(windows))'.dependencies]  # https://github.com/vorner/signal-hook/issues/100
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
libc = "0.2.186"

[build-dependencies]
loader = { path = "../loader" }

[dev-dependencies]
smallvec = "1.15"
indoc = "2.0.6"
tempfile.workspace = true
same-file = "1.0.1"
