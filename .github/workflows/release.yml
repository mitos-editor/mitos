name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package-release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      ref: ${{ github.sha }}
      tag: ${{ github.event_name == 'push' && github.ref_name || format('preview-{0}', github.sha) }}
      publish-stable: ${{ github.event_name == 'push' && github.repository == 'mitos-editor/mitos' }}
      attest: ${{ github.event_name == 'push' && github.repository == 'mitos-editor/mitos' }}
