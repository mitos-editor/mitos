# Keep the platform-independent C runtime linkage setting alongside user target flags.
[target."cfg(all())"]
rustflags = ["-C", "target-feature=-crt-static"]


[alias]
xtask = "run --package xtask --"
# Process fixtures are enabled only for integration targets; unit tests use explicit backends.
integration-test = "test --features integration --profile integration --workspace --test integration"

