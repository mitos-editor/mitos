[language-server.actions-language-server]
command = "actions-languageserver"
args = ["--stdio"]

[language-server.actions-language-server.config.actions-language-server]
sessionToken = ""

[language-server.ansible-language-server]
command = "ansible-language-server"
args = ["--stdio"]

[language-server.astro-ls]
command = "astro-ls"
args = [ "--stdio" ]
config = { typescript = { tsdk = "node_modules/typescript/lib" } }

[language-server.lua-language-server]
command = "lua-language-server"

[language-server.lua-language-server.config.Lua.hint]
enable = true
arrayIndex = "Enable"
setType = true
paramName = "All"
paramType = true
await = true

[language-server.gopls]
command = "gopls"

[language-server.gopls.config.hints]
assignVariableTypes = true
compositeLiteralFields = true
constantValues = true
functionTypeParameters = true
parameterNames = true
rangeVariableTypes = true

[language-server.golangci-lint-lsp]
command = "golangci-lint-langserver"

[language-server.golangci-lint-lsp.config]
command = ["golangci-lint", "run", "--output.json.path=stdout", "--show-stats=false", "--issues-exit-code=1"]

[language-server.regal]
command = "regal"
args = ["language-server"]
config = { provideFormatter = true }

[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config]
inlayHints.bindingModeHints.enable = false
inlayHints.closingBraceHints.minLines = 10
inlayHints.closureReturnTypeHints.enable = "with_block"
inlayHints.discriminantHints.enable = "fieldless"
inlayHints.lifetimeElisionHints.enable = "skip_trivial"
inlayHints.typeHints.hideClosureInitialization = false

[language-server.rust-analyzer.config.files]
watcher = "server"

[language-server.tsc]
command = "tsc"
args = ["--lsp", "--stdio"]

[language-server.tsc.config.typescript]
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.tsc.config.javascript]
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.tsc.config.tsx]
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.tsc.config.jsx]
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]
config.hostInfo = "mitos"

[language-server.typescript-language-server.config.typescript.inlayHints]
includeInlayEnumMemberValueHints = true
includeInlayFunctionLikeReturnTypeHints = true
includeInlayFunctionParameterTypeHints = true
includeInlayParameterNameHints = "all"
includeInlayParameterNameHintsWhenArgumentMatchesName = true
includeInlayPropertyDeclarationTypeHints = true
includeInlayVariableTypeHints = true

[language-server.typescript-language-server.config.javascript.inlayHints]
includeInlayEnumMemberValueHints = true
includeInlayFunctionLikeReturnTypeHints = true
includeInlayFunctionParameterTypeHints = true
includeInlayParameterNameHints = "all"
includeInlayParameterNameHintsWhenArgumentMatchesName = true
includeInlayPropertyDeclarationTypeHints = true
includeInlayVariableTypeHints = true

[language-server.svelteserver]
command = "svelteserver"
args = ["--stdio"]

[language-server.svelteserver.config.configuration.typescript]
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.enumMemberValues.enabled = true
inlayHints.parameterNames.enabled = "all"

[language-server.svelteserver.config.configuration.javascript]
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.enumMemberValues.enabled = true
inlayHints.parameterNames.enabled = "all"

[language-server.vscode-eslint-language-server]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.vscode-eslint-language-server.config]
validate = "on"
rulesCustomizations = []
run = "onType"
problems = { shortenToSingleLine = false }
nodePath = ""

[language-server.vscode-eslint-language-server.config.codeAction.disableRuleComment]
enable = true
location = "separateLine"

[language-server.vscode-eslint-language-server.config.codeAction.showDocumentation]
enable = true

[language-server.vscode-eslint-language-server.config.workingDirectory]
mode = "location"

[language-server.clarinet]
command = "clarinet"
args = ["lsp"]

[language-server.docker-language-server]
command = "docker-language-server"
args = ["start", "--stdio"]

[language-server.kcl-lsp]
command = "kcl-language-server"
args = ["server", "--stdio"]

[language-server.drools-lsp]
command = "drools-lsp"

[language-server.moonbit-lsp]
command = "moonbit-lsp"

[language-server.millet]
command = "millet-ls"

[[language]]
name = "rust"
scope = "source.rust"
injection-regex = "rs|rust"
file-types = ["rs"]
roots = ["Cargo.toml", "Cargo.lock"]
shebangs = ["rust-script", "cargo"]
auto-format = true
comment-tokens = ["//", "///", "//!"]
block-comment-tokens = [
  { start = "/*", end = "*/" },
  { start = "/**", end = "*/" },
  { start = "/*!", end = "*/" },
]
language-servers = [ "rust-analyzer" ]
indent = { tab-width = 4, unit = "    " }
persistent-diagnostic-sources = ["rustc", "clippy"]

[language.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'

[language.debugger]
name = "lldb-dap"
transport = "stdio"
command = "lldb-dap"

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { program = "{0}" }

[[language.debugger.templates]]
name = "binary (terminal)"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { program = "{0}", runInTerminal = true }

[[language.debugger.templates]]
name = "attach"
request = "attach"
completion = [ "pid" ]
args = { pid = "{0}" }

[[language.debugger.templates]]
name = "gdbserver attach"
request = "attach"
completion = [ { name = "lldb connect url", default = "connect://localhost:3333" }, { name = "file", completion = "filename" }, "pid" ]
args = { attachCommands = [ "platform select remote-gdb-server", "platform connect {0}", "file {1}", "attach {2}" ] }

[[grammar]]
name = "rust"
source = { git = "https://github.com/tree-sitter/tree-sitter-rust", rev = "77a3747266f4d621d0757825e6b11edcbf991ca5" }

[[language]]
name = "sway"
scope = "source.sway"
injection-regex = "sway"
file-types = ["sw"]
language-servers = [ "forc" ]
roots = ["Forc.toml", "Forc.lock"]
indent = { tab-width = 4, unit = "    " }
comment-token = "//"

[[grammar]]
name = "sway"
source = { git = "https://github.com/FuelLabs/tree-sitter-sway", rev = "9b7845ce06ecb38b040c3940970b4fd0adc331d1" }

[[language]]
name = "toml"
scope = "source.toml"
injection-regex = "toml"
file-types = [
  "toml",
  { glob = "pdm.lock" },
  { glob = "poetry.lock" },
  { glob = "Cargo.lock" },
  { glob = "uv.lock" },
  { glob = "containers.conf" },
  { glob = "containers.conf.d/*.conf" },
  { glob = "containers.conf.modules/*.conf" },
  { glob = "mounts.conf" },
  { glob = "policy.conf" },
  { glob = "registries.conf" },
  { glob = "storage.conf" },
  { glob = "staticcheck.conf" },
]
comment-token = "#"
language-servers = [{ alternatives = ["tombi", "taplo"] }]
indent = { tab-width = 2, unit = "  " }

[[grammar]]
name = "toml"
source = { git = "https://github.com/tree-sitter-grammars/tree-sitter-toml", rev = "64b56832c2cffe41758f28e05c756a3a98d16f41" }

[[language]]
name = "awk"
scope = "source.awk"
injection-regex = "awk"
file-types = ["awk", "gawk", "nawk", "mawk"]
comment-token = "#"
language-servers = [ "awk-language-server" ]
indent = { tab-width = 2, unit = "  " }

[[grammar]]
name = "awk"
source = { git = "https://github.com/Beaglefoot/tree-sitter-awk", rev = "34bbdc7cce8e803096f47b625979e34c1be38127" }

[[language]]
name = "protobuf"
scope = "source.proto"
injection-regex = "proto"
file-types = ["proto"]
language-servers = [{ alternatives = ["buf", "protols", "pbkit"] }]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 2, unit = "  " }
grammar = "proto"

[[grammar]]
name = "proto"
source = { git = "https://github.com/sdoerner/tree-sitter-proto", rev = "35a6a3b543e418b7037328261f40e912c767c598"}

[[language]]
name = "textproto"
file-types = ["txtpb", "textpb", "textproto"]
comment-token = "#"
scope = "source.textproto"
indent = { tab-width = 2, unit = "  " }
formatter = { command = "txtpbfmt" }
auto-format = true

[[grammar]]
name = "textproto"
source = { git = "https://github.com/PorterAtGoogle/tree-sitter-textproto", rev = "568471b80fd8793d37ed01865d8c2208a9fefd1b"}

[[language]]
name = "eiffel"
