name: Book

on:
  pull_request:
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: Build and check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build site
        run: ./book/cloudflare-build.sh
      - name: Check links and TOML examples
        run: python3 book/check.py
