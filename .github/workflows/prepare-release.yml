name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'mitos-editor/mitos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create draft for a merged version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: python3 .github/scripts/release.py draft

      - name: Fetch the release tag
        run: git fetch origin --tags

      - name: Check for an existing release PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh pr list --state open --base main --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName == "automation/release" or (.headRefName | startswith("release-plz-")))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != 0 ]; then
            echo 'The existing release PR and its curated notes are preserved.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Rust
        if: steps.existing.outputs.count == '0'
        uses: ./.github/actions/rust-setup
        with:
          toolchain: '1.97.1'
          cache-key: prepare-release

      - name: Install git-cliff
        if: steps.existing.outputs.count == '0'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff@2.14.2

      - name: Prepare version and changelog
        if: steps.existing.outputs.count == '0'
        id: release
        run: python3 .github/scripts/release.py prepare

      - name: Open release PR
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          token: ${{ secrets.RELEASE_PAT }}
          branch: automation/release
          delete-branch: true
          base: main
          add-paths: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
          commit-message: 'chore(release): prepare v${{ steps.release.outputs.version }}'
          title: 'chore: release v${{ steps.release.outputs.version }}'
          body: |
            Prepare the next Mitos release with one version and one changelog.

            Review the version and curate CHANGELOG.md before merging. Merging creates
            a draft release and starts packaging; publication remains manual.
