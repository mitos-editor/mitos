name: Nix binary cache

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/*.nix'
      - flake.lock
      - nix/**
      - .github/workflows/cachix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.system }})
    if: github.repository == 'mitos-editor/mitos' && (github.event_name == 'pull_request' || vars.CACHIX_CACHE_NAME != '')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15-intel
            system: x86_64-darwin
          - os: macos-15
            system: aarch64-darwin
    steps:
      - name: Check upload credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Set the CACHIX_AUTH_TOKEN secret before enabling cache publishing."
            exit 1
          fi

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Configure Cachix
        if: vars.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
          # Upload the package and its runtime closure, excluding build-only outputs.
          pathsToPush: result

      - name: Build flake package
        run: nix build --print-build-logs --no-update-lock-file .#packages.${{ matrix.system }}.default

      - name: Check executable
        run: ./result/bin/ms --version
