[book]
authors = ["Blaž Hrastnik"]
language = "en"
src = "src"
title = "Mitos"

[output.html]
default-theme = "light"
preferred-dark-theme = "colibri"
git-repository-url = "https://github.com/mitos-editor/mitos"
edit-url-template = "https://github.com/mitos-editor/mitos/edit/main/book/{path}"
additional-css = ["custom.css"]
additional-js = ["ts-query.js", "page-toc.js", "doc-versions.js"]
no-section-label = true
sidebar-header-nav = false

[output.html.search]
use-boolean-and = true

[output.html.redirect]
"package-managers.html" = "install.html#package-managers"
"ecosystem.html" = "other-software.html"
"language-server-setup.html" = "lsp.html"

[output.linkcheck2]
optional = true
follow-web-links = false
warning-policy = "error"
