[package]
name = "mitos-router-test-guest"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin-sdk = { path = "../../../../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
