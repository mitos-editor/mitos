[package]
name = "term"
description = "Mitos terminal application, command handlers, event loop, and interactive UI"
include = ["src/**/*", "README.md", "LICENSE"]
default-run = "ms"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.deb]
# generate a .deb in target/debian/ with the command: cargo deb --no-build
name = "mitos"
assets = [
  { source = "target/release/ms", dest = "/usr/lib/mitos/", mode = "755" },
  { source = "../../contrib/ms_launcher.sh", dest = "/usr/bin/ms", mode = "755" },
  { source = "../../runtime/*", dest = "/usr/lib/mitos/runtime/", mode = "644" },
  { source = "../../runtime/grammars/*", dest = "/usr/lib/mitos/runtime/grammars/", mode = "644" }, # to avoid sources/
  { source = "../../runtime/queries/**/*", dest = "/usr/lib/mitos/runtime/queries/", mode = "644" },
  { source = "../../runtime/themes/**/*", dest = "/usr/lib/mitos/runtime/themes/", mode = "644" },
  { source = "../../runtime/dictionaries/**/*", dest = "/usr/lib/mitos/runtime/dictionaries/", mode = "644" },
  { source = "../../README.md", dest = "/usr/share/doc/mitos/", mode = "644" },
  { source = "../../FORK.md", dest = "/usr/share/doc/mitos/", mode = "644" },
  { source = "../../LICENSE", dest = "/usr/share/doc/mitos/", mode = "644" },
  { source = "../../contrib/completion/ms.bash", dest = "/usr/share/bash-completion/completions/ms", mode = "644" },
  { source = "../../contrib/completion/ms.fish", dest = "/usr/share/fish/vendor_completions.d/ms.fish", mode = "644" },
  { source = "../../contrib/completion/ms.zsh", dest = "/usr/share/zsh/vendor-completions/_ms", mode = "644" },
  { source = "../../contrib/Mitos.desktop", dest = "/usr/share/applications/Mitos.desktop", mode = "644" },
]

[features]
default = ["git"]
unicode-lines = ["core/unicode-lines", "view/unicode-lines"]
integration = ["event/integration_test"]
git = ["vcs/git"]

[[bin]]
name = "ms"
path = "src/main.rs"

[dependencies]
command-line.workspace = true
stdx.workspace = true
core.workspace = true
event.workspace = true
view = { workspace = true, features = ["term"] }
lsp.workspace = true
snippets.workspace = true
dap.workspace = true
vcs.workspace = true
loader.workspace = true

anyhow.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "process", "macros", "fs", "parking_lot"] }
tui = { workspace = true, default-features = false, features = ["termina", "crossterm"] }
ui-core = { workspace = true, features = ["term"] }
termina = { workspace = true, features = ["event-stream"] }
signal-hook.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
arc-swap.workspace = true
ratatui-image.workspace = true
image.workspace = true
termini.workspace = true
indexmap = { workspace = true, features = ["serde"] }

# Logging
log = { workspace = true, features = ["std"] }

# File picker
nucleo.workspace = true
ignore.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
grep-matcher.workspace = true
# markdown doc rendering
pulldown-cmark.workspace = true
thiserror.workspace = true

# opening URLs
open.workspace = true

# config
toml.workspace = true

serde_json.workspace = true
serde.workspace = true

dashmap.workspace = true

[target.'cfg(windows)'.dependencies]
crossterm = { workspace = true, features = ["event-stream"] }

[target.'cfg(not(windows))'.dependencies]  # https://github.com/vorner/signal-hook/issues/100
signal-hook-tokio = { workspace = true, features = ["futures-v0_3"] }
libc.workspace = true

[build-dependencies]
loader.workspace = true

[dev-dependencies]
indoc.workspace = true
tempfile.workspace = true
same-file.workspace = true
