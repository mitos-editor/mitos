[package]
name = "lsp-types"
version = "0.97.0"
publish = false
authors = ["Markus Westerlind <marwes91@gmail.com>", "Bruno Medeiros <bruno.do.medeiros@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Types for interaction with a language server, using VSCode's Language Server Protocol"

repository.workspace = true

readme = "README.md"

keywords = ["language", "server", "lsp", "vscode", "lsif"]

license = "MIT"

[dependencies]
bitflags = "2"
# Keep the derive implementation matched to the Serde version.
serde = { version = "1.0.103", features = ["derive"] }
# Value and Map implement Eq starting at this version.
serde_json = "1.0.50"
serde_repr = "0.1"
fluent-uri = "0.4"

[features]
default = []
# Compatibility alias. All standard LSP 3.18 definitions are enabled by default.
proposed = ["legacy-offset-encoding"]
# Non-standard clangd offsetEncoding extension, superseded by positionEncodings.
legacy-offset-encoding = []
