# Moves the `stable` branch to each published release, so that `stable` is a
# fixed ref for the latest release. This workflow runs when a release is
# published, not when its tag is pushed, because a release stays in draft until
# a maintainer has checked its artifacts.
name: Stable branch

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-stable-branch:
    name: Move stable to the release commit
    if: github.repository == 'mitos-editor/mitos' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the `stable` branch
    steps:
      # Git needs the full history to know that the push moves the branch
      # forward. With a shallow clone, it rejects the push.
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # The push is not a force push, so it can only move the branch forward.
      # If the release commit is not a descendant of `stable`, the job fails
      # and the branch does not change.
      - name: Push to the stable branch
        run: git push origin HEAD:refs/heads/stable
