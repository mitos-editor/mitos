[workspace]
release_always = false
git_only = true
git_tag_enable = false
git_release_enable = false
changelog_update = false
# All workspace packages track the same editor release tag.
git_tag_name = "v{{ version }}"
semver_check = false
pr_draft = false

[[package]]
name = "term"
git_tag_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "buffer", "clipboard", "command-line", "core", "diagnostics", "dap", "dap-types", "debugger", "event",
  "grammar-build", "language", "language-config", "loader", "lsp", "parsec", "search",
  "snippets", "spelling", "stdx", "text-io", "theme", "tui", "ui-core", "vcs",
  "view", "workspace", "xtask",
  "word-index", "file-watch", "pane-layout", "syntax-symbols",
  "text-layout", "text-render", "editor-config", "fuzzy", "text-diff", "syntax-diff",
]
git_release_name = "Mitos {{ version }}"
git_release_enable = true
