name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Prepare release PR and publish merged release
    if: github.repository == 'mitos-editor/mitos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: '1.97.1'
          cache-key: release-plz

      - name: Prepare release PR
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release-pr
          version: '0.3.169'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Publish merged release
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release
          version: '0.3.169'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
