name: Book

on:
  pull_request:
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: Build and check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MDBOOK_OUTPUT__LINKCHECK2__OPTIONAL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install link checker
        run: cargo +stable install mdbook-linkcheck2 --version 0.12.2 --locked
      - name: Build site
        run: ./book/cloudflare-build.sh
