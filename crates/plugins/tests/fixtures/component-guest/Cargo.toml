[package]
name = "mitos-component-test-guest"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc", "std"] }
[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
