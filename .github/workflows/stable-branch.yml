name: Stable branch

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: stable-branch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.repository == 'mitos-editor/mitos' &&
      (github.event_name == 'release' || github.ref == 'refs/heads/main') &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Follow the latest published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/update-stable.sh
