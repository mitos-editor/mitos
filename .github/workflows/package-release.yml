name: Package release

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
      publish-stable:
        type: boolean
        default: false
      attest:
        type: boolean
        default: false

permissions:
  contents: read

env:
  preview: ${{ !inputs.publish-stable }}

jobs:
  fetch-grammars:
    name: Fetch Grammars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.97.1'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Fetch tree-sitter grammars
        run: cargo run --locked --package=grammar-build --bin=grammar-fetch

      - name: Bundle grammars
        run: bash .github/scripts/bundle-grammars.sh runtime/grammars/sources grammars.tar.xz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grammars
          path: grammars.tar.xz

  dist:
    name: Dist
    needs: [fetch-grammars]
    env:
      # Emit backtraces on panics.
      RUST_BACKTRACE: 1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        build: [x86_64-linux, aarch64-linux, x86_64-macos, x86_64-windows, aarch64-macos, aarch64-windows]
        include:
        - build: x86_64-linux
          # WARN: When changing this to a newer version, make sure that the GLIBC isnt too new, as this can cause issues
          # with portablity on older systems that dont follow ubuntus more rapid release cadence.
          os: ubuntu-22.04
          rust: '1.97.1'
          target: x86_64-unknown-linux-gnu
        - build: aarch64-linux
          # Version should be kept in lockstep with the x86_64 version
          os: ubuntu-22.04-arm
          rust: '1.97.1'
          target: aarch64-unknown-linux-gnu
        - build: x86_64-macos
          os: macos-15-intel
          rust: '1.97.1'
          target: x86_64-apple-darwin
        - build: x86_64-windows
          os: windows-latest
          rust: '1.97.1'
          target: x86_64-pc-windows-msvc
        - build: aarch64-macos
          os: macos-15
          rust: '1.97.1'
          target: aarch64-apple-darwin
        - build: aarch64-windows
          os: windows-11-arm
          rust: '1.97.1'
          target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download grammars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grammars

      - name: Move grammars under runtime
        shell: bash
        run: |
          mkdir -p runtime/grammars/sources
          tar xJf grammars.tar.xz -C runtime/grammars/sources

      # The rust-toolchain action ignores rust-toolchain.toml files.
      # Removing this before building with cargo ensures that the rust-toolchain
      # is considered the same between installation and usage.
      - name: Remove the rust-toolchain.toml file
        run: rm rust-toolchain.toml

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      - name: Show command used for Cargo
        run: |
          echo "target flag is: ${{ env.TARGET_FLAGS }}"

      - name: Compile release grammars
        run: cargo run --locked --package grammar-build --bin grammar-build -- --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --profile opt --locked --target ${{ matrix.target }}

      - name: Install cargo-deb
        id: cargo-deb
        if: matrix.build == 'x86_64-linux'
        continue-on-error: true
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deb@3.7.0

      # Some prebuilt cargo-deb binaries require a newer glibc than our release runner.
      - name: Build cargo-deb from source
        if: matrix.build == 'x86_64-linux' && steps.cargo-deb.outcome == 'failure'
        run: cargo install cargo-deb --version 3.7.0 --locked --force

      - name: Build Deb
        shell: bash
        if: matrix.build == 'x86_64-linux'
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/opt/ms target/release/
          if [[ "$BUILD_TAG" == nightly-* ]]; then
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "term") | .version')
            cargo deb --no-build --deb-version "$version~$BUILD_TAG"
          else
            cargo deb --no-build
          fi
          mkdir -p dist
          mv target/debian/*.deb dist/

      - name: Stage executable and runtime
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/opt/ms.exe" "dist/"
          else
            cp "target/${{ matrix.target }}/opt/ms" "dist/"
          fi
          if [ -d runtime/grammars/sources ]; then
            rm -rf runtime/grammars/sources
          fi
          cp -r runtime dist

      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUILD: ${{ matrix.build }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag }}
        run: |
          bash .github/scripts/build-appimage.sh "${BUILD%-linux}" \
            dist/ms dist/runtime "dist/mitos-$VERSION-${BUILD%-linux}.AppImage"

      - name: Smoke test AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: python .github/scripts/test-release.py dist/*.AppImage

      - name: Package and test platform archive
        shell: bash
        env:
          BUILD_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.build }}
        run: |
          package="mitos-$BUILD_TAG-$PLATFORM"
          mkdir -p "$package/contrib"
          cp LICENSE README.md "$package/"
          cp -r contrib/completion "$package/contrib/"
          mv dist/runtime "$package/"
          if [[ "$PLATFORM" == *-windows ]]; then
            mv dist/ms.exe "$package/"
            python -m zipfile -c "dist/$package.zip" "$package"
            python .github/scripts/test-release.py "dist/$package.zip"
          else
            mv dist/ms "$package/"
            tar cJf "dist/$package.tar.xz" "$package"
            python .github/scripts/test-release.py "dist/$package.tar.xz"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bins-${{ matrix.build }}
          path: dist

  publish:
    name: Assemble release artifacts
    needs: [dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload to GitHub release
      id-token: write # sign provenance attestations
      attestations: write # write provenance to the attestations API
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Assemble assets and source archive
        shell: bash
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -ex

          source="$(pwd)"
          tag="$BUILD_TAG"
          mkdir -p runtime/grammars/sources
          tar xJf grammars/grammars.tar.xz -C runtime/grammars/sources
          rm -rf grammars

          cd "$(mktemp -d)"
          mv "$source"/bins-* .
          mkdir dist

          for dir in bins-*; do
            mv "$dir"/* dist/
          done
          chmod +x dist/*.AppImage

          # Include tracked sources and pinned grammar sources, without checkout
          # credentials, Git metadata, or intermediate CI artifacts.
          source_package="$(mktemp -d)"
          git -C "$source" archive HEAD | tar xf - -C "$source_package"
          mkdir -p "$source_package/runtime/grammars"
          cp -a "$source/runtime/grammars/sources" "$source_package/runtime/grammars/"
          tar cJf "dist/mitos-$tag-source.tar.xz" --exclude=.git -C "$source_package" .
          mv dist "$source/"

      - name: Generate release checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.attest
        with:
          subject-path: 'dist/*'

      - name: Find draft release
        id: draft-release
        if: env.preview == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          release=$(gh release view "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft)
          release_id=$(jq -er 'select(.isDraft == true) | .databaseId' <<< "$release")
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload binaries to draft release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        if: env.preview == 'false'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ inputs.tag }}
          overwrite: true
          release_id: ${{ steps.draft-release.outputs.release_id }}
          draft: true
          make_latest: false

      - name: Upload binaries as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.preview == 'true'
        with:
          name: release
          path: dist/*
          retention-days: 7
