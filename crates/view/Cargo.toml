[package]
name = "view"
description = "Editor state, documents, views, input, and themes for Mitos"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# Skip libtest benchmark harness, the benches use criterion.
# cargo bench -p view --features bench
bench = false

[features]
default = []
term = ["termina", "ui-core/term"]
unicode-lines = []
# Exposes internals. Should not be enabled except for benchmarking.
bench = []

[dependencies]
command-line.workspace = true
ui-core.workspace = true
stdx.workspace = true
core.workspace = true
event.workspace = true
loader.workspace = true
lsp.workspace = true
snippets.workspace = true
dap.workspace = true
vcs.workspace = true
ratatui.workspace = true

foldhash.workspace = true
anyhow.workspace = true
termina = { workspace = true, optional = true }

tempfile.workspace = true

arc-swap.workspace = true

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "process", "macros", "fs", "parking_lot"] }
tokio-stream.workspace = true
futures-util.workspace = true

slotmap.workspace = true

chardetng.workspace = true

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true

parking_lot.workspace = true
spellbook.workspace = true
thiserror.workspace = true

smartstring.workspace = true
arrayvec.workspace = true

[target.'cfg(windows)'.dependencies]
clipboard-win = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
criterion.workspace = true
quickcheck.workspace = true

[[bench]]
name = "word_index"
harness = false
required-features = ["bench"]
